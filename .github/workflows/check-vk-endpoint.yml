name: Check updated official VK endpoint (dry run)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-vk-endpoint.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public VK wall access without publishing data
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python scripts/collect_vk.py --max-profiles 5 --dry-run
