name: Collect YuAO public birth dates
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 1 * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect dates from public biographies
        run: python3 scripts/collect_birth_dates.py
      - name: Sync dates into the public site
        run: python3 scripts/sync_birth_dates.py
      - name: Audit all districts
        run: python3 scripts/audit_birth_dates.py
      - name: Commit updated sourced records and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deputies.json index.html reports/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh source-linked birth dates across YuAO"
            git push
          fi
