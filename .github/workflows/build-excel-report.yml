name: Build downloadable Excel report
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vk-posts.json'
      - 'build_excel_report.py'
      - '.github/workflows/build-excel-report.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python build_excel_report.py
      - name: Commit generated report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deputies_YUAO_Report.xlsx Deputies_YUAO_Ranking.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Update validated downloadable Excel report"
            git push
          fi
