name: Test free VK collection (one profile)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public VK data (or explain missing token)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python scripts/vk_pilot.py
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: vk-pilot-report
          path: pilot-vk-report.json
          retention-days: 7
