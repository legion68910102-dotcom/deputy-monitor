name: Collect VK posts (when API access is available)
on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'
permissions:
  contents: write
concurrency:
  group: vk-posts
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified posts
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python scripts/collect_vk.py
          python scripts/collect_vk_avatars.py
      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json vk-posts.json vk-avatars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified VK monitoring data"
            git push
          fi
