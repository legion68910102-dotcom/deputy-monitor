name: Collect public VK posts (official API; 159 profiles)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = offline only; pilot = read 5 VK walls without saving; full = collect all 159'
        required: true
        type: choice
        options:
          - test
          - pilot
          - full
        default: test
      confirm_full:
        description: 'For a manual full run, type YES; otherwise no API calls'
        required: false
        type: string
        default: 'NO'
  schedule:
    - cron: '47 6,18 * * *'
  push:
    paths:
      - 'scripts/collect_vk.py'
      - 'tests/test_collect_vk.py'
      - 'tests/test_verify_vk_collection.py'
      - 'scripts/verify_vk_collection.py'
      - 'tests/test_vk_monitor_freshness.cjs'
      - 'vk-monitor-freshness-v1.js'
      - 'index-v129.html'
      - 'deputies.json'
      - '.github/workflows/collect-vk.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: official-vk-public-posts
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Check lossless merge without any VK credentials or network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and deterministic VK mocks
        run: |
          python -m py_compile scripts/collect_vk.py
          python -m unittest discover -s tests -p 'test_*vk*.py' -v
          node --check vk-monitor-freshness-v1.js
          node tests/test_vk_monitor_freshness.cjs
      - name: Report VK credential readiness without exposing secrets
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        shell: bash
        run: |
          if [ -n "$VK_TOKEN" ]; then
            echo "VK_TOKEN repository secret is configured (actual wall.get access not yet verified)."
            echo "VK credential: present; permission check requires pilot/full collection." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::VK_TOKEN repository secret is NOT configured. Real VK collection is blocked."
            echo "VK credential: missing; scheduled live collection will fail until the owner configures VK_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi

  collect:
    name: Pilot or full official VK API collection
    needs: offline-tests
    # User enabled automatic monitoring: scheduled collection must run and
    # fail visibly when VK_TOKEN is absent, never show a green 'tests only' run.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check mode and official VK API credential
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
          VK_CONFIRM_FULL: ${{ inputs.confirm_full }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VK_TOKEN" ]; then
            echo "::error::VK_TOKEN is missing in GitHub Actions Secrets. Automatic VK monitoring is NOT active; configure this secret to enable it. No VK requests were made."
            exit 1
          fi
          if [ "$VK_MODE" = full ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Full collection is allowed only on main."
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VK_CONFIRM_FULL" != YES ]; then
              echo "::error::Manual full run requires confirm_full=YES."
              exit 1
            fi
          elif [ "$VK_MODE" != pilot ]; then
            echo "::error::Unknown VK collection mode."
            exit 1
          fi
      - name: Query public VK walls (pilot writes nothing)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VK_MODE" = pilot ]; then
            python scripts/collect_vk.py --max-profiles 5 --dry-run
            echo "::notice::Pilot finished; no VK data files changed."
          else
            python scripts/collect_vk.py
          fi
      - name: Commit verified public VK data without force-push
        if: ${{ (github.event_name == 'schedule') || (inputs.mode == 'full') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-posts.json monitor-status.json
          if git diff --cached --quiet; then
            echo "No verified public VK data changed"
            exit 0
          fi
          git commit -m "Update official VK API public posts and coverage"
          git pull --rebase origin main
          git push origin HEAD:main
          # Actions commits do not fire normal push workflows. Dispatch explicitly
          # so posts, AI categories, downloadable reports and Pages stay in sync.
          for workflow in ai-classify-activity.yml build-excel-report.yml pages.yml; do
            echo "Dispatching downstream workflow $workflow"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          done
      - name: Validate public VK walls were actually checked
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'full' }}
        run: python scripts/verify_vk_collection.py
