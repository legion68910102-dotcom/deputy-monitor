name: Monitor VK posts (Apify disabled - zero-cost policy)
on:
  workflow_dispatch:
    inputs:
      confirm_paid_api:
        description: 'Legacy field; paid requests are disabled regardless of value'
        required: false
        default: 'NO'
        type: string
      batch_index:
        description: 'Legacy field; ignored'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/import-vk-apify.yml'
permissions:
  contents: read
jobs:
  zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce zero-cost policy
        run: |
          echo "::notice::Apify collection is disabled in zero-cost mode. No credentials read, no Actor started, no data changes."
