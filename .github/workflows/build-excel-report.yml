name: Build downloadable Excel report
on:
  # Scheduled rebuild is necessary: pushes made with GITHUB_TOKEN do not trigger
  # downstream push workflows, including after VK collection updates vk-posts.json.
  schedule:
    - cron: '20 8,20 * * *'
  push:
    branches: [main]
    paths:
      - 'deputies.json'
      - 'index-v129.html'
      - 'vk-posts.json'
      - 'build_excel_report.py'
      - '.github/workflows/build-excel-report.yml'
  workflow_dispatch:
concurrency:
  group: deputy-monitor-excel-reports
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python build_excel_report.py
      - name: Commit generated report if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deputies_YUAO_Report.xlsx Deputies_YUAO_Ranking.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Update validated downloadable Excel report"
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
                exit 0
              fi
              echo "Concurrent GitHub update; retrying report publication ($i/3)"
              sleep $((i * 3))
            done
            echo "::error::Could not publish the report after three attempts"
            exit 1
          fi
