name: Publish deputy monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify approved v129 interface before publishing
        shell: bash
        run: |
          set -euo pipefail
          expected=73cc0bd64f7878690061993862f5ffa2a60ae518
          for file in index.html index-v129.html; do
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::Approved v129 interface changed. Explicit owner approval and an intentional baseline update are required."
              exit 1
            fi
          done
          cmp index.html index-v129.html
          echo "Approved v129 HTML verified; data updates are allowed."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
