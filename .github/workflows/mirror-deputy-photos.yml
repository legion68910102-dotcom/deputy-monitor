name: Mirror deputy photos
on:
  push:
    paths:
      - '.github/workflows/mirror-deputy-photos.yml'
      - 'scripts/mirror_deputy_photos.py'
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify official photos
        run: python scripts/mirror_deputy_photos.py
      - name: Publish local photo copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/deputy-photos
          if ! git diff --cached --quiet; then
            git commit -m "Host available deputy photos locally on GitHub Pages"
            git push
          fi
