name: Check VK public profile availability
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public page reachability
        run: python scripts/check_public_profiles.py
      - name: Commit status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public VK availability status"
            git push
          fi
