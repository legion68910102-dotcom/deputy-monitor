name: Update VK deputy avatars
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: write
concurrency:
  group: vk-avatars
  cancel-in-progress: false
jobs:
  avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public VK avatars for 159 profiles
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python3 scripts/collect_vk_avatars.py
      - name: Commit refreshed public avatar links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-avatars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update deputy VK avatars"
            git push
          fi
