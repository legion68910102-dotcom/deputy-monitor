name: Start new approved five-year monitoring term
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Actual approval/update date (YYYY-MM-DD)
        required: true
        type: string
      confirm:
        description: Type YES only after verifying complete new roster in imports/next-term-deputies.json
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: official-vk-public-posts
  cancel-in-progress: false
jobs:
  transition:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate term transition without network
        env:
          START_DATE: ${{ inputs.start_date }}
        run: |
          python -m unittest discover -s tests -p test_vk_monitoring_term.py -v
          python scripts/start_monitoring_term.py --roster imports/next-term-deputies.json --start "$START_DATE"
      - name: Archive old term and activate verified roster
        env:
          START_DATE: ${{ inputs.start_date }}
        run: |
          set -euo pipefail
          python scripts/start_monitoring_term.py --roster imports/next-term-deputies.json --start "$START_DATE" --apply
          python -m pip install openpyxl==3.1.5
          python build_excel_report.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archives deputies.json monitoring-term-v1.js vk-posts.json monitor-status.json Deputies_YUAO_Report.xlsx Deputies_YUAO_Ranking.xlsx
          git commit -m "Activate verified new monitoring term and archive previous term"
          git push origin HEAD:main
      - name: Publish new term
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
