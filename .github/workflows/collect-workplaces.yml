name: Collect YuAO workplaces
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 2 * *'
permissions:
  contents: write
concurrency:
  group: yuаo-workplaces
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public workplace data for all 159 profiles
        run: python3 scripts/collect_workplaces.py
      - name: Sync sourced workplaces to deputy cards
        run: python3 scripts/sync_workplaces.py
      - name: Commit source-linked data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deputies.json index.html reports/workplace-collection.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public workplace biographies across YuAO"
            git push
          fi
