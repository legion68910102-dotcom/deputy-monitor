name: Activity classification (zero-cost local rules)
on:
  workflow_dispatch:
  push:
    paths:
      - "vk-posts.json"
      - "scripts/classify-activity-ai.mjs"
      - "scripts/activity-batch-helper.cjs"
      - "scripts/test-activity-batching.mjs"
      - "scripts/test-activity-taxonomy.mjs"
      - "activity-analysis-v129.js"
      - "activity-category-policy-v1.js"
      - "activity-taxonomy-approved-v1.json"
      - ".github/workflows/ai-classify-activity.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test local classification without paid API
        run: |
          node --check activity-analysis-v129.js
          node --check activity-category-policy-v1.js
          node --check scripts/classify-activity-ai.mjs
          node scripts/test-activity-batching.mjs
          node -e 'const t=require("./activity-taxonomy-approved-v1.json"); if(t.categories.length!==15||t.categories.reduce((n,c)=>n+c.phrases.length,0)<230)process.exit(1)'
          node scripts/test-activity-taxonomy.mjs
          node --test tests/test_repost_detection.cjs
          echo "Zero-cost mode: local rules in browser; historical AI cache retained; no GigaChat requests."
