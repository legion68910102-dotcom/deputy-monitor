name: Browser smoke test for approved v129
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke-v129.yml'
      - 'index.html'
      - 'index-v129.html'
      - 'activity-analysis-v129.js'
      - 'activity-analysis-worker-v1.js'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium webkit
      - name: Verify actual browser startup against saved public snapshot
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/deputy-http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { chromium, webkit, devices } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const archive=JSON.parse(fs.readFileSync('vk-posts.json','utf8'));
          const term=JSON.parse(fs.readFileSync('monitoring-term-v1.js','utf8').split('window.dmMonitoringTerm = ')[1].trim().replace(/;$/,''));
          const handles=new Set(term.roster.map(p=>p.handle));
          const expected=archive.posts.filter(p=>handles.has(p.profile)&&String(p.date).slice(0,10)>=term.start&&String(p.date).slice(0,10)<=term.end).length;
          for(const engine of [chromium,webkit]){
            const browser=await engine.launch({headless:true});
          try{
            for(const path of ['index.html','index-v129.html']){
              const context=await browser.newContext({...devices['iPhone 13'],isMobile:true});
              const page=await context.newPage();
              const errors=[], failures=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('requestfailed',r=>{if(r.url().startsWith('http://127.0.0.1:8765/'))failures.push(r.url().split('/').pop()+': '+r.failure()?.errorText)});
              await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8765/')?r.continue():r.abort());
              const started=Date.now();
              await page.goto('http://127.0.0.1:8765/'+path,{waitUntil:'domcontentloaded',timeout:30000});
              try{
                await page.waitForFunction(()=>Number(document.getElementById('total')?.textContent)>0,{},{timeout:40000});
              }catch(e){
                console.log('STARTUP_TIMEOUT',path,JSON.stringify({errors,failures,banner:await page.locator('#vk-sync-heading').textContent().catch(()=>null)}));
                throw e;
              }
              const state=await page.evaluate(()=>({roster:window.deputyRoster?.length,total:document.getElementById('total')?.textContent,checked:document.getElementById('checked')?.textContent,banner:document.getElementById('vk-sync-heading')?.textContent,archive:document.getElementById('deputy-archive-list')?.textContent?.includes('Ильяшенко')}));
              console.log('BROWSER_STARTUP',path,JSON.stringify({elapsed_ms:Date.now()-started,expected,...state,errors,failures}));
              assert.equal(state.roster,term.roster.length);
              assert.equal(Number(state.total),expected);
              assert.equal(state.archive,true);
              const contacts=await page.evaluate(()=>{
                const groups=[...document.querySelectorAll('#profiles .district-group')];
                return {districts:groups.length,contacts:groups.filter(g=>g.querySelectorAll(':scope > .deputy-contact a[href^="tel:"]').length===1).length,insideCards:document.querySelectorAll('#profiles .deputy-tile .deputy-contact').length};
              });
              console.log('DISTRICT_RECEPTION',engine.name(),path,JSON.stringify(contacts));
              assert.equal(contacts.districts,16);
              assert.equal(contacts.contacts,16);
              assert.equal(contacts.insideCards,0);
              assert.deepEqual(errors,[]);
              const birthdayTest=await page.evaluate(()=>{
                const group=document.querySelector('#profiles .district-group');
                const district=group.dataset.district;
                const members=dmDistrictBirthdayNames.get(district);
                const backup=members.map(n=>[n,Object.hasOwn(deputyBio,n),deputyBio[n]]);
                const today=window.dmDateFilter.today();
                const other=today.slice(5)==='01-01'?'01-02':'01-01';
                try{
                  for(const name of members)deputyBio[name]={...deputyBio[name],birth:'1980-'+other};
                  deputyBio[members[0]].birth='1980-'+today.slice(5);
                  render();
                  const badge=()=>[...document.querySelectorAll('#profiles .district-group')].find(e=>e.dataset.district===district).querySelector(':scope > summary > .district-birthday');
                  const visible=!badge().hidden&&getComputedStyle(badge()).display!=='none'&&!badge().closest('details').open;
                  document.getElementById('search').value='no-matching-person-test';
                  render();
                  const visibleDuringSearch=!badge().hidden;
                  deputyBio[members[0]].birth='1980-'+other;
                  render();
                  const hidden=badge().hidden&&getComputedStyle(badge()).display==='none';
                  return {visible,visibleDuringSearch,hidden};
                }finally{
                  for(const [name,had,value] of backup){if(had)deputyBio[name]=value;else delete deputyBio[name]}
                  document.getElementById('search').value='';render();
                }
              });
              console.log('DISTRICT_BIRTHDAY',engine.name(),path,JSON.stringify(birthdayTest));
              assert.deepEqual(birthdayTest,{visible:true,visibleDuringSearch:true,hidden:true});
              for(const section of ['activity','report','ranking','activity-analysis']){
                const el=page.locator('#'+section+' > details');
                await el.evaluate(e=>e.open=true);
                if(section==='activity-analysis')await page.waitForFunction(()=>document.getElementById('activity-summary').textContent.includes('Анализ обновлён'),{},{timeout:120000});
                else await page.waitForTimeout(1500);
                console.log('SECTION',section,JSON.stringify({errors,rows:await el.locator('tbody tr').count()}));
                if(section==='activity'){
                  const result=await page.evaluate(()=>{
                    const tbody=document.getElementById('posts');
                    const initial=tbody.rows.length,linkCount=window.activitySelectedLinks.length;
                    const expectedLinks=allRows().filter(p=>/^https:\/\//i.test(String(p.url||""))&&window.dmDateFilter.includes(p.date,document.getElementById('activity-date-from').value,document.getElementById('activity-date-to').value)).length;
                    const profileNode=document.querySelector('#profiles .district-group');
                    const next=document.getElementById('activity-feed-next'),prev=document.getElementById('activity-feed-prev');
                    next.click();const second=tbody.rows.length;
                    next.click();const third=tbody.rows.length;
                    next.click();const nextPage=tbody.rows.length,offset=dmFeedState.start;
                    prev.click();const previousPage=tbody.rows.length;
                    const linksUnchanged=linkCount===window.activitySelectedLinks.length;
                    const search=document.getElementById('activity-person-search');
                    const person=window.deputyRoster.find(p=>p.handle&&allRows().some(r=>r.profile===p.handle));
                    search.value=person.name;search.dispatchEvent(new Event('change'));
                    const filtered=window.activitySelectedLinks.every(p=>p.name===person.name)&&window.activitySelectedLinks.length>0;
                    const from=document.getElementById('activity-date-from'),to=document.getElementById('activity-date-to');
                    const date=window.activitySelectedLinks[0].date.slice(0,10);
                    from.value=date;to.value=date;from.dispatchEvent(new Event('change'));
                    const dateFiltered=window.activitySelectedLinks.length>0&&window.activitySelectedLinks.every(p=>p.date.slice(0,10)===date);
                    search.value='';document.getElementById('activity-date-reset').click();
                    return {initial,second,third,nextPage,offset,previousPage,linkCount,expectedLinks,linksUnchanged,filtered,dateFiltered,profilesUnchanged:profileNode===document.querySelector('#profiles .district-group')};
                  });
                  console.log('FEED_PAGING',engine.name(),path,JSON.stringify(result));
                  assert.equal(result.initial,50);
                  assert.equal(result.second,100);
                  assert.equal(result.third,150);
                  assert.equal(result.nextPage,50);
                  assert.equal(result.offset,150);
                  assert.equal(result.previousPage,50);
                  assert.equal(result.linkCount,result.expectedLinks);
                  assert.equal(result.linksUnchanged,true);
                  assert.equal(result.filtered,true);
                  assert.equal(result.dateFiltered,true);
                  assert.equal(result.profilesUnchanged,true);
                }
                if(section==='activity-analysis'){
                  const initial=await page.locator('#activity-results tr').count();
                  assert.ok(initial<=150&&initial>0);
                  const person=await page.evaluate(()=>window.deputyRoster.find(p=>p.handle&&allRows().some(r=>r.profile===p.handle)).name);
                  await page.locator('#activity-person').selectOption(person);
                  await page.waitForFunction(()=>document.getElementById('activity-cards').querySelectorAll('button').length===15,{},{timeout:120000});
                  for(let k=0;k<3;k++){
                    const category=page.locator('#activity-cards button').nth(k);
                    await category.click();
                    await page.waitForFunction(key=>document.querySelector('#activity-cards button.is-active')?.dataset.activityCategory===key,await category.getAttribute('data-activity-category'),{timeout:30000});
                    assert.ok(await page.locator('#activity-results tr').count()<=150);
                    assert.ok(await page.locator('#activity-posts details').count()<=60);
                  }
                  console.log('ANALYSIS_INTERACTION',engine.name(),path,JSON.stringify({initial,errors}));
                }
                await el.evaluate(e=>e.open=false);
              }
              assert.deepEqual(errors,[]);
              // Wait for IndexedDB to commit the complete public archive, then simulate a slow/failed archive fetch.
              await page.waitForFunction(()=>new Promise(resolve=>{
                const q=indexedDB.open('deputy-monitor-public-snapshot',1);
                q.onerror=()=>resolve(false);
                q.onsuccess=()=>{const db=q.result;try{const r=db.transaction('snapshots').objectStore('snapshots').get('vk-posts');r.onsuccess=()=>{resolve(Array.isArray(r.result?.posts)&&r.result.posts.length>0);db.close()};r.onerror=()=>{db.close();resolve(false)}}catch(e){db.close();resolve(false)}};
              }),{},{timeout:20000});
              await page.route('**/vk-posts.json',r=>r.abort());
              await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(n=>Number(document.getElementById('total')?.textContent)===n,expected,{timeout:20000});
              console.log('CACHE_RELOAD',engine.name(),path,JSON.stringify({total:await page.locator('#total').textContent(),errors}));
              assert.deepEqual(errors,[]);
              await context.close();
            }
          }finally{await browser.close()}
          }
          JS
