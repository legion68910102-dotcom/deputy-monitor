name: Check official district deputy listings

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    paths:
      - 'scripts/collect_official_deputies.py'
      - '.github/workflows/collect-official-deputies.yml'

permissions:
  contents: write

concurrency:
  group: official-deputy-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing requirements
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test source parser (offline)
        run: python scripts/collect_official_deputies.py --self-test
      - name: Collect reviewable information from official council websites
        run: python scripts/collect_official_deputies.py
      - name: Commit the published cache only (never touch deputy directory)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp official-deputy-candidates.json /tmp/official-deputy-candidates.json
          cp official-deputy-snapshot.js /tmp/official-deputy-snapshot.js
          git restore --staged --worktree official-deputy-candidates.json official-deputy-snapshot.js
          git pull --ff-only origin main
          cp /tmp/official-deputy-candidates.json official-deputy-candidates.json
          cp /tmp/official-deputy-snapshot.js official-deputy-snapshot.js
          git add official-deputy-candidates.json official-deputy-snapshot.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public official deputy review candidates"
            git push origin HEAD:main
          fi
