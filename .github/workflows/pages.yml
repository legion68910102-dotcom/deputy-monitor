name: Publish deputy monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify approved v129 interface before publishing
        shell: bash
        run: |
          set -euo pipefail
          expected=3f626244efae6df34f78cf073ec8afe97a5bd771
          for file in index.html index-v129.html; do
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::Approved v129 interface changed. Explicit owner approval and an intentional baseline update are required."
              exit 1
            fi
          done
          cmp index.html index-v129.html
          check_file() {
            local file="$1" expected_hash="$2" actual_hash
            actual_hash="$(git hash-object "$file")"
            if [ "$actual_hash" != "$expected_hash" ]; then
              echo "::error file=$file::Approved v129 module changed. Explicit owner approval is required."
              exit 1
            fi
          }
          check_file 'date-filter-v1.js' '1ebccde051822136793b55250186fad7b0642262'
          check_file 'okrug-branding-v132.js' '9cf28cfab88d1e21147900de4b28827232047455'
          check_file 'district-coats-uao-v133.js' '944b561ec2d003c16cc565032239111b5962243c'
          check_file 'repost-detection-v131.js' 'a01dc38bb43a00d525ab7d7dae9423d0b785a305'
          check_file 'personal-workspace-v130.js' 'd843287cd52f4c5e31289b1e1146d962edc68f0c'
          check_file 'vk-monitor-freshness-v1.js' '21dbf40032597464082f1a71faa9b633498691bf'
          check_file 'activity-category-policy-v1.js' '0ed758d112607b0d3e618a5c8eb7c0ea7b9a895e'
          check_file 'activity-analysis-v129.js' 'f9cd4cd1aa7bbb6e0652c3114b9ac8db793835c6'
          check_file 'activity-analysis-worker-v1.js' '975c49cc5470056967e64c4ac584c236141aaad6'
          check_file 'official-deputy-contacts-v1.js' '3510a493977f57f942a282f7d1d766f3b4212dd9'
          echo "Approved v129 HTML and ten static modules verified; data updates are allowed."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
